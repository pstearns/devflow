<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>DevFlow · Sign in</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23478be6'/%3E%3Cpath d='M4 4h4a4 4 0 0 1 0 8H4z' fill='none' stroke='white' stroke-width='1.6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="mx-auto mt-24 w-full max-w-sm px-4">
      <h1 class="mb-1 text-[18px] font-semibold tracking-tight">DevFlow</h1>
      <p class="mb-4 text-muted">Local admin sign-in</p>
      <div id="banner" role="status" class="mb-3 hidden rounded border border-line bg-panel px-3 py-2"></div>
      <!-- If scripts fail, a plain submit still goes to the JSON-only endpoint (rejected) and never puts the password in a URL. -->
      <form id="f" method="post" action="/api/auth/login" class="space-y-3 rounded-md border border-line bg-panel p-4">
        <label class="block"><span class="mb-1 block text-[12px] text-muted">Password</span>
          <input id="pw" name="password" type="password" autocomplete="current-password" autofocus required maxlength="1024"
            class="w-full rounded border border-line bg-raised px-2 py-1.5 text-fg" /></label>
        <button id="go" type="submit" class="w-full rounded border border-line bg-raised px-2 py-1.5 hover:border-accent disabled:opacity-50">Sign in</button>
        <p id="err" role="alert" class="hidden text-bad"></p>
      </form>
      <p class="mt-3 text-[11px] text-muted">Single local administrator. The account is created in a terminal with <span class="mono">npm run auth:setup</span>.</p>
    </main>
    <script type="module" src="/src/login.ts"></script>
  </body>
</html>
